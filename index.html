<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lore Indexor - Master Archive & Editor</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            darkbg: '#0f172a',
            cardbg: '#1e293b',
          }
        }
      }
    }
  </script>
  <!-- Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Load Private Config -->
  <script src="config.js"></script>
  <style>
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #475569; }
    
    aside { 
      transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
      width: 320px; 
      touch-action: pan-y; 
    }
    aside.collapsed { width: 0px !important; padding: 0 !important; border: none !important; overflow: hidden !important; }
    
    .lore-link { color: #60a5fa; text-decoration: underline; cursor: pointer; }
    .lore-link:hover { color: #93c5fd; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] w-screen flex flex-col font-sans selection:bg-emerald-500 selection:text-slate-950 overflow-hidden relative">

  <!-- Main App Layout -->
  <div class="flex flex-1 h-full w-full overflow-hidden relative">
    
    <!-- Sidebar -->
    <aside id="sidebar" class="bg-slate-900 border-r border-slate-800 flex flex-col p-4 gap-3 select-none z-20 h-full flex-shrink-0 relative">
      <!-- Header & Collapse Toggle -->
      <div class="flex items-center justify-between border-b border-slate-800 pb-3 flex-shrink-0">
        <div class="overflow-hidden">
          <h1 class="text-xs md:text-sm font-black tracking-widest text-emerald-400 whitespace-nowrap">LORE INDEXOR</h1>
          <p class="text-[9px] text-slate-400 tracking-wider whitespace-nowrap">Master Archive v4.9</p>
        </div>
        <button onclick="toggleSidebar()" class="p-2 bg-slate-800 hover:bg-slate-700 rounded text-slate-300 text-xs transition shadow-sm" title="Collapse Sidebar">
          <span class="font-bold">◀</span>
        </button>
      </div>

      <!-- Sidebar Content Container -->
      <div class="flex-1 overflow-y-auto flex flex-col gap-3 pr-1 text-xs custom-scrollbar min-h-0">
        
        <!-- Drive Auth & Sync Controls -->
        <div class="flex flex-col gap-2 bg-slate-950/40 p-2.5 rounded-lg border border-slate-800/80">
          <button id="authBtn" onclick="handleAuthClick()" class="w-full py-2 px-3 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold rounded text-xs transition shadow-sm flex items-center justify-center gap-1.5 whitespace-nowrap">
            <span>Connect Google Drive</span>
          </button>
          <div class="flex gap-1.5">
            <button onclick="fetchDriveFile()" class="flex-1 py-1 px-2 bg-slate-800 hover:bg-slate-700 text-[11px] font-medium rounded border border-slate-700 text-slate-300 transition">
              Fetch Drive
            </button>
            <button onclick="saveDriveFile()" class="flex-1 py-1 px-2 bg-blue-600 hover:bg-blue-500 text-[11px] font-semibold rounded text-white transition shadow-sm">
              Save Drive
            </button>
          </div>
          <div class="flex items-center gap-2 mt-0.5 px-1">
            <div id="driveStatus" class="w-2.5 h-2.5 rounded-full bg-rose-500 shadow-sm flex-shrink-0" title="Disconnected"></div>
            <span id="statusText" class="text-[11px] text-slate-400 truncate">Drive Disconnected</span>
          </div>
        </div>

        <!-- Search Filter -->
        <div class="relative">
          <input type="text" id="searchInput" placeholder="Search entries, tags..." oninput="filterEntries()" class="w-full bg-slate-950 border border-slate-800 rounded-md px-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition">
        </div>

        <!-- Index List -->
        <div class="flex-1 min-h-0 flex flex-col">
          <div class="flex items-center justify-between mb-1.5 flex-shrink-0">
            <span class="text-[10px] text-slate-500 uppercase tracking-widest font-extrabold">Lore Index</span>
            <button onclick="scrollToCard('index')" class="text-[10px] text-emerald-400 hover:underline">Top of Archive</button>
          </div>
          <div id="indexList" class="text-slate-400 italic text-xs space-y-0.5 overflow-y-auto flex-1 custom-scrollbar">No file loaded...</div>
        </div>

        <!-- Add Entry Button -->
        <button onclick="addNewEntry()" class="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-black rounded text-xs transition shadow-sm mt-2 flex-shrink-0">
          + Add New Entry
        </button>
      </div>
    </aside>

    <!-- Content Workspace -->
    <main class="flex-1 flex flex-col bg-slate-950 overflow-hidden h-full">
      <!-- View Toggle Bar -->
      <header class="bg-slate-900 border-b border-slate-800 px-4 md:px-6 py-2.5 flex items-center justify-between select-none flex-shrink-0 gap-2">
        <div class="flex items-center gap-2">
          <button onclick="toggleSidebar()" id="expandBtn" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-md transition hidden shadow-sm flex-shrink-0" title="Expand Sidebar">
            ▶
          </button>
          <!-- 3-Page View Switcher -->
          <div class="flex gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800">
            <button id="readerTabBtn" onclick="switchView('reader')" class="px-3 py-1 text-xs font-bold rounded-md bg-blue-600 text-white transition shadow-sm">View</button>
            <button id="editorTabBtn" onclick="switchView('editor')" class="px-3 py-1 text-xs font-semibold rounded-md text-slate-400 hover:text-white transition">Editor</button>
            <button id="txtTabBtn" onclick="switchView('txt')" class="px-3 py-1 text-xs font-semibold rounded-md text-slate-400 hover:text-white transition">Txt</button>
          </div>
        </div>
        <div class="flex gap-2">
          <label class="px-3 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-md text-xs font-medium text-slate-200 cursor-pointer transition flex items-center gap-1.5">
            <span>Open Local</span>
            <input type="file" id="localFileInput" accept=".txt,.md" onchange="handleLocalFileLoad(event)" class="hidden">
          </label>
          <button onclick="copyRawText()" class="px-3 py-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-md text-xs font-medium text-slate-200 transition">Copy Raw</button>
        </div>
      </header>

      <!-- View Containers -->
      <div class="flex-1 overflow-y-auto p-4 md:p-6 custom-scrollbar min-h-0 relative">
        <!-- Reader & Card Editor View -->
        <div id="readerView" class="max-w-4xl mx-auto space-y-6 pb-12">
          <div class="text-center text-slate-500 py-24 border border-dashed border-slate-800 rounded-2xl bg-slate-900/20">
            <p class="text-sm font-medium">No master lore file currently loaded into Lore Indexor.</p>
          </div>
        </div>

        <!-- Raw Txt Direct Editor View (Page 3) -->
        <div id="txtView" class="hidden h-full max-w-4xl mx-auto flex flex-col pb-6">
          <div class="bg-slate-900 border border-slate-800 border-b-0 rounded-t-xl px-4 py-2 flex items-center justify-between">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Direct TXT Raw Editor</span>
            <span class="text-[10px] text-emerald-400">Edits sync instantly to View & Editor cards</span>
          </div>
          <textarea id="rawTextArea" oninput="handleRawTxtInput()" class="w-full flex-1 bg-slate-900 border border-slate-800 rounded-b-xl p-4 font-mono text-xs text-slate-200 focus:outline-none focus:border-blue-500 resize-none leading-relaxed custom-scrollbar min-h-[550px]" placeholder="Raw file content..."></textarea>
        </div>
      </div>
    </main>
  </div>

  <!-- Custom In-App Modal Dialog -->
  <div id="customModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 w-full max-w-md shadow-2xl space-y-4">
      <h3 id="modalTitle" class="text-sm font-bold text-emerald-400 uppercase tracking-widest">Add Tag</h3>
      <div id="modalBody" class="space-y-3"></div>
      <div class="flex justify-end gap-2 pt-2">
        <button onclick="closeModal()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs rounded transition">Cancel</button>
        <button id="modalSubmitBtn" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold text-xs rounded transition shadow-sm">Save Tag</button>
      </div>
    </div>
  </div>

<!-- Script Logic -->
  <script>
    const CLIENT_ID = typeof CONFIG !== 'undefined' ? CONFIG.CLIENT_ID : '';
    const DRIVE_FILE_ID = typeof CONFIG !== 'undefined' ? CONFIG.DRIVE_FILE_ID : '';

    let tokenClient;
    let accessToken = localStorage.getItem('google_access_token') || null;
    let fileContent = "";
    let parsedEntries = [];
    let masterIndexEntry = null;
    let masterTagListEntry = null;
    let allExistingTags = new Set();
    let allExistingCategories = new Set(['PETA TAGS', 'META TAGS', 'LORE TAGS', 'RELATIONS TAGS']);
    let sidebarCollapsed = false;
    let currentView = 'reader';

    const categoryColorPalette = [
      { bg: 'bg-purple-950', text: 'text-purple-300', border: 'border-purple-800' },
      { bg: 'bg-indigo-950', text: 'text-indigo-300', border: 'border-indigo-800' },
      { bg: 'bg-amber-950', text: 'text-amber-300', border: 'border-amber-800' },
      { bg: 'bg-pink-950', text: 'text-pink-300', border: 'border-pink-800' },
      { bg: 'bg-teal-950', text: 'text-teal-300', border: 'border-teal-800' },
      { bg: 'bg-cyan-950', text: 'text-cyan-300', border: 'border-cyan-800' },
      { bg: 'bg-rose-950', text: 'text-rose-300', border: 'border-rose-800' },
      { bg: 'bg-orange-950', text: 'text-orange-300', border: 'border-orange-800' }
    ];
    const categoryColorMap = {};

    function getCategoryStyle(categoryKey) {
      const cleanKey = categoryKey.toUpperCase().trim();
      if (!categoryColorMap[cleanKey]) {
        const index = Object.keys(categoryColorMap).length % categoryColorPalette.length;
        categoryColorMap[cleanKey] = categoryColorPalette[index];
      }
      return categoryColorMap[cleanKey];
    }

    window.onload = function () {
      initGoogleDriveSDK();
    };

    window.addEventListener('pageshow', function (event) {
      if (event.persisted) {
        window.dispatchEvent(new Event('resize'));
        if (accessToken && parsedEntries.length === 0) {
          fetchDriveFile();
        }
      }
    });

    let touchStartX = 0;
    let touchCurrentX = 0;
    const sidebar = document.getElementById('sidebar');

    document.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
    }, { passive: true });

    document.addEventListener('touchmove', (e) => {
      touchCurrentX = e.touches[0].clientX;
      const diffX = touchCurrentX - touchStartX;

      if (!sidebarCollapsed && diffX < -70 && touchStartX < 350) {
        toggleSidebar();
        touchStartX = touchCurrentX;
      }
      
      if (sidebarCollapsed && diffX > 70 && touchStartX < 40) {
        toggleSidebar();
        touchStartX = touchCurrentX;
      }
    }, { passive: true });

    function initGoogleDriveSDK() {
      if (window.google) {
        try {
          tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: 'https://www.googleapis.com/auth/drive',
            callback: (response) => {
              if (response.error !== undefined) {
                console.error(response);
                return;
              }
              accessToken = response.access_token;
              localStorage.setItem('google_access_token', accessToken);
              updateAuthUI(true);
              fetchDriveFile();
            },
          });

          if (accessToken) {
            updateAuthUI(true);
            fetchDriveFile();
          } else {
            tokenClient.requestAccessToken({ prompt: '' });
          }
        } catch (err) {
          console.error("SDK Init Error", err);
        }
      }
    }

    function updateAuthUI(isConnected) {
      const statusDot = document.getElementById('driveStatus');
      const authBtn = document.getElementById('authBtn');
      const statusText = document.getElementById('statusText');

      if (isConnected) {
        statusDot.className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-sm shadow-emerald-500/50 flex-shrink-0';
        authBtn.innerText = '✓ Drive Connected';
        authBtn.className = 'w-full py-2 px-3 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold rounded text-xs transition shadow-sm flex items-center justify-center gap-1.5';
        statusText.innerText = 'Drive Connected';
      } else {
        statusDot.className = 'w-2.5 h-2.5 rounded-full bg-rose-500 shadow-sm flex-shrink-0';
        authBtn.innerText = 'Connect Google Drive';
        authBtn.className = 'w-full py-2 px-3 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold rounded text-xs transition shadow-sm flex items-center justify-center gap-1.5';
        statusText.innerText = 'Drive Disconnected';
      }
    }

    function handleAuthClick() {
      if (accessToken) {
        fetchDriveFile();
        return;
      }
      if (tokenClient) {
        tokenClient.requestAccessToken({ prompt: 'select_account' });
      } else {
        alert('Google SDK not fully loaded yet. Please refresh.');
      }
    }

    async function fetchDriveFile() {
      if (!accessToken) {
        handleAuthClick();
        return;
      }
      try {
        let res = await fetch(`https://www.googleapis.com/drive/v3/files/${DRIVE_FILE_ID}?alt=media`, {
          headers: { 'Authorization': `Bearer ${accessToken}` }
        });
        if (res.status === 401) {
          localStorage.removeItem('google_access_token');
          accessToken = null;
          updateAuthUI(false);
          tokenClient.requestAccessToken({ prompt: '' });
          return;
        }
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        fileContent = await res.text();
        document.getElementById('rawTextArea').value = fileContent;
        parseLoreContent(fileContent);
        
        if (!sidebarCollapsed) {
          toggleSidebar();
        }
      } catch (err) {
        console.error(err);
        alert('Fetch Error: Could not fetch file content. Click Fetch Drive to retry.');
      }
    }

    async function saveDriveFile() {
      if (currentView === 'txt') {
        fileContent = document.getElementById('rawTextArea').value;
      } else {
        serializeAndSync();
      }
      if (!accessToken) {
        alert('Please connect Google Drive first.');
        return;
      }
      try {
        let res = await fetch(`https://www.googleapis.com/upload/drive/v3/files/${DRIVE_FILE_ID}?uploadType=media`, {
          method: 'PATCH',
          headers: {
            'Authorization': `Bearer ${accessToken}`,
            'Content-Type': 'text/plain'
          },
          body: fileContent
        });
        if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
        alert('File saved successfully to Google Drive!');
      } catch (err) {
        console.error(err);
        alert('Save Error: Could not save file content.');
      }
    }

    function handleLocalFileLoad(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        fileContent = e.target.result;
        document.getElementById('rawTextArea').value = fileContent;
        parseLoreContent(fileContent);
        if (!sidebarCollapsed) toggleSidebar();
      };
      reader.readAsText(file);
    }

    function toggleSidebar() {
      sidebarCollapsed = !sidebarCollapsed;
      const sidebar = document.getElementById('sidebar');
      const expandBtn = document.getElementById('expandBtn');
      
      if (sidebarCollapsed) {
        sidebar.classList.add('collapsed');
        expandBtn.classList.remove('hidden');
      } else {
        sidebar.classList.remove('collapsed');
        expandBtn.classList.add('hidden');
      }
    }

    function switchView(viewName) {
      currentView = viewName;
      const readerTab = document.getElementById('readerTabBtn');
      const editorTab = document.getElementById('editorTabBtn');
      const txtTab = document.getElementById('txtTabBtn');
      const readerView = document.getElementById('readerView');
      const txtView = document.getElementById('txtView');

      readerTab.className = viewName === 'reader' ? 'px-3 py-1 text-xs font-bold rounded-md bg-blue-600 text-white transition shadow-sm' : 'px-3 py-1 text-xs font-semibold rounded-md text-slate-400 hover:text-white transition';
      editorTab.className = viewName === 'editor' ? 'px-3 py-1 text-xs font-bold rounded-md bg-blue-600 text-white transition shadow-sm' : 'px-3 py-1 text-xs font-semibold rounded-md text-slate-400 hover:text-white transition';
      txtTab.className = viewName === 'txt' ? 'px-3 py-1 text-xs font-bold rounded-md bg-blue-600 text-white transition shadow-sm' : 'px-3 py-1 text-xs font-semibold rounded-md text-slate-400 hover:text-white transition';

      if (viewName === 'txt') {
        readerView.classList.add('hidden');
        txtView.classList.remove('hidden');
        document.getElementById('rawTextArea').value = fileContent;
      } else {
        if (!txtView.classList.contains('hidden')) {
          fileContent = document.getElementById('rawTextArea').value;
          parseLoreContent(fileContent, false);
        }
        txtView.classList.add('hidden');
        readerView.classList.remove('hidden');
        showFullDocument();
      }
    }

    function handleRawTxtInput() {
      fileContent = document.getElementById('rawTextArea').value;
      parseLoreContent(fileContent, false);
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function escapeQuotes(str) {
      return String(str).replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    // 100% Non-destructive parser that preserves raw text verbatim
    function parseLoreContent(text, updateTextArea = true) {
      const rawEntryBlocks = text.split(/(?=ENTRY:\s*)/i);
      
      parsedEntries = [];
      allExistingTags.clear();
      allExistingCategories.add('PETA TAGS');
      allExistingCategories.add('META TAGS');
      allExistingCategories.add('LORE TAGS');
      allExistingCategories.add('RELATIONS TAGS');

      // 1. Capture exact Master Index section verbatim
      const parts = text.split(/={10,}/);
      if (parts.length > 0) {
        masterIndexEntry = { id: 'index', title: 'THE MASTER LORE INDEX', body: parts[0].trim(), lastEdited: 'Archive' };
      }

      // 2. Capture exact Master Tag List section verbatim
      const tagPart = parts.find(p => p.toUpperCase().includes('MASTER TAG LIST'));
      if (tagPart) {
        masterTagListEntry = { id: 'tags', title: 'THE MASTER TAG LIST', body: tagPart.replace(/THE MASTER TAG LIST/i, '').trim(), lastEdited: 'Archive' };
        
        // Extract valid subtags (non-bracketed lines under bracketed category headers containing TAGS)
        let inValidCategory = false;
        const tagLines = tagPart.split('\n');
        tagLines.forEach(l => {
          const lt = l.trim();
          if (lt.startsWith('[') && lt.endsWith(']')) {
            const inner = lt.slice(1, -1).trim();
            if (inner.toUpperCase().includes('TAGS')) {
              inValidCategory = true;
              allExistingCategories.add(inner.toUpperCase());
            } else {
              inValidCategory = false; // Definition brackets without 'TAGS' are ignored as tags
            }
          } else if (lt && inValidCategory && !lt.startsWith('[')) {
            allExistingTags.add(lt);
          }
        });
      } else {
        masterTagListEntry = { id: 'tags', title: 'THE MASTER TAG LIST', body: '[PETA TAGS]\nPlaces\n\n[META TAGS]\nOriginal\nFan-Fiction', lastEdited: 'Archive' };
      }

      // 3. Parse individual entry cards
      rawEntryBlocks.forEach((block) => {
        const trimmed = block.trim();
        if (!trimmed || !trimmed.toUpperCase().startsWith('ENTRY:')) return;

        const lines = trimmed.split('\n');
        const titleLine = lines[0] || '';
        const title = titleLine.replace(/^ENTRY:\s*/i, '').trim();
        if (!title) return;

        let lastEdited = new Date().toISOString().split('T')[0];
        const dateLine = lines.find(l => l.includes('Last Edited:'));
        if (dateLine) {
          const dateMatch = dateLine.match(/Last Edited:\s*([0-9-]+)/);
          if (dateMatch) lastEdited = dateMatch[1];
        }

        let dynamicTags = {};
        const tagLineRegexOutside = /^\[\s*([A-Z\s_-]+)\s*\]\s*:\s*(.+)$/i;
        const tagLineRegexInside = /^\[\s*([A-Z\s_-]+)\s*:\s*(.+)\s*\]$/i;

        lines.forEach(l => {
          const lt = l.trim();
          let match = lt.match(tagLineRegexOutside) || lt.match(tagLineRegexInside);
          if (match) {
            const cat = match[1].trim();
            if (!cat.toUpperCase().includes('LAST EDITED')) {
              allExistingCategories.add(cat.toUpperCase());
              const vals = match[2].split('|').map(s => s.trim()).filter(Boolean);
              dynamicTags[cat] = vals;
              vals.forEach(v => allExistingTags.add(v));
            }
          }
        });

        const bodyLines = lines.filter(l => {
          const lt = l.trim();
          if (lt.includes('====') || lt.includes('----') || lt.toUpperCase().startsWith('ENTRY:') || lt.includes('Last Edited:')) return false;
          let match = lt.match(tagLineRegexOutside) || lt.match(tagLineRegexInside);
          if (match && !match[1].toUpperCase().includes('LAST EDITED')) return false;
          return true;
        });
        
        const body = bodyLines.join('\n').trim();
        const tags = (block.match(/#[a-zA-Z0-9_-]+/g) || []).map(t => t.substring(1));

        parsedEntries.push({ id: parsedEntries.length, title, body, tags, dynamicTags, lastEdited, raw: block });
      });

      if (updateTextArea) {
        const rawTextArea = document.getElementById('rawTextArea');
        if (rawTextArea) rawTextArea.value = text;
      }
      renderSidebarList(parsedEntries);
      if (currentView !== 'txt') {
        showFullDocument();
      }
    }

    function serializeAndSync() {
      // Only rebuilds entry cards; leaves Master Index and Master Tag List verbatim as user wrote them
      const indexBody = masterIndexEntry ? masterIndexEntry.body : '[INDEX]';
      const tagBody = masterTagListEntry ? masterTagListEntry.body : '';

      let entryBlocks = parsedEntries.map(e => {
        let tagLines = "";
        for (const [cat, vals] of Object.entries(e.dynamicTags)) {
          tagLines += `[${cat}]: ${vals.join(' | ')}\n`;
        }
        return `====================================================================\nENTRY: ${e.title}\n[Last Edited: ${e.lastEdited}]\n${tagLines}\n====================================================================\n\n${e.body}`;
      });

      fileContent = `${indexBody}\n\n====================================================================\nTHE MASTER TAG LIST\n\n${tagBody}\n\n${entryBlocks.join('\n\n')}\n`;
      const rawTextArea = document.getElementById('rawTextArea');
      if (rawTextArea) rawTextArea.value = fileContent;
      renderSidebarList(parsedEntries);
    }

    function updateEntryTitle(id, newTitle) {
      const entry = parsedEntries.find(e => e.id === id);
      if (entry && entry.title !== newTitle.trim()) {
        entry.title = newTitle.trim();
        entry.lastEdited = new Date().toISOString().split('T')[0];
        serializeAndSync();
      }
    }

    function updateEntryBody(id, newBody) {
      const entry = parsedEntries.find(e => e.id === id);
      if (entry && entry.body !== newBody.trim()) {
        entry.body = newBody.trim();
        entry.lastEdited = new Date().toISOString().split('T')[0];
        serializeAndSync();
      }
    }

    function updateSpecialCardBody(type, newBody) {
      if (type === 'index' && masterIndexEntry) masterIndexEntry.body = newBody.trim();
      else if (type === 'tags' && masterTagListEntry) masterTagListEntry.body = newBody.trim();
      serializeAndSync();
    }

    function renderProcessedBody(bodyText) {
      let formatted = escapeHtml(bodyText);
      const sortedEntries = [...parsedEntries].sort((a, b) => b.title.length - a.title.length);
      
      sortedEntries.forEach(entry => {
        if (entry.title) {
          const escapedTitle = entry.title.replace(/[-\/\\^$*+?.()|[\]{}]/g, '\\$&');
          const regex = new RegExp(`\\b(${escapedTitle})\\b`, 'g');
          formatted = formatted.replace(regex, `<span class="lore-link" onclick="scrollToEntryTitle('${escapeQuotes(entry.title)}')">$1</span>`);
        }
      });
      return formatted;
    }

    function scrollToCard(cardId) {
      const el = document.getElementById('card-' + cardId);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function openModal(title, bodyHtml, onSubmit) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalBody').innerHTML = bodyHtml;
      const submitBtn = document.getElementById('modalSubmitBtn');
      submitBtn.onclick = () => {
        onSubmit();
        closeModal();
      };
      document.getElementById('customModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('customModal').classList.add('hidden');
    }

    function promptAddTag(entryId, defaultCategory) {
      const entry = parsedEntries.find(e => e.id === entryId);
      if (!entry) return;

      const isPetaOnly = defaultCategory === 'PETA TAGS';
      const tagOptionsHtml = Array.from(allExistingTags).sort().map(t => `<option value="${escapeHtml(t)}">`).join('');
      const catOptionsHtml = Array.from(allExistingCategories).sort().map(c => `<option value="${escapeHtml(c)}">`).join('');

      const bodyHtml = `
        <div class="space-y-2">
          <label class="text-[11px] text-slate-400 font-medium">Tag Value:</label>
          <input type="text" id="modalTagVal" list="existingTagsList" placeholder="Enter or select tag..." class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
          <datalist id="existingTagsList">${tagOptionsHtml}</datalist>
        </div>
        ${!isPetaOnly ? `
        <div class="space-y-2 pt-1">
          <label class="text-[11px] text-slate-400 font-medium">Main Tag Category:</label>
          <input type="text" id="modalCatVal" list="existingCatsList" placeholder="META TAGS" value="META TAGS" class="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-emerald-500">
          <datalist id="existingCatsList">${catOptionsHtml}</datalist>
        </div>` : ''}
      `;

      openModal(isPetaOnly ? 'Add PETA Tag' : 'Add New Tag', bodyHtml, () => {
        const valInput = document.getElementById('modalTagVal').value.trim();
        if (!valInput) return;
        const category = isPetaOnly ? 'PETA TAGS' : document.getElementById('modalCatVal').value.trim().toUpperCase();
        if (!category) return;

        if (!entry.dynamicTags[category]) entry.dynamicTags[category] = [];
        if (!entry.dynamicTags[category].includes(valInput)) entry.dynamicTags[category].push(valInput);
        allExistingTags.add(valInput);
        allExistingCategories.add(category);
        entry.lastEdited = new Date().toISOString().split('T')[0];
        
        serializeAndSync();
        showFullDocument();
      });
    }

    function removeTag(entryId, category, tagVal) {
      const entry = parsedEntries.find(e => e.id === entryId);
      if (!entry || !entry.dynamicTags[category]) return;

      entry.dynamicTags[category] = entry.dynamicTags[category].filter(v => v !== tagVal);
      if (entry.dynamicTags[category].length === 0) delete entry.dynamicTags[category];
      entry.lastEdited = new Date().toISOString().split('T')[0];

      serializeAndSync();
      showFullDocument();
    }

    function renderSpecialCard(card) {
      const isEditable = currentView === 'editor';
      const isIndex = card.id === 'index';
      return `
        <article id="card-${card.id}" class="bg-slate-900/85 border border-slate-800 rounded-xl p-6 shadow-md space-y-4 hover:border-emerald-500/40 transition">
          <div class="flex flex-col border-b border-slate-800 pb-3 gap-2.5">
            <div class="flex items-center justify-between gap-2">
              <h2 class="text-lg font-bold ${isIndex ? 'text-emerald-400' : 'text-amber-400'} tracking-wide">${escapeHtml(card.title)}</h2>
              <span class="text-xs font-mono text-slate-400">${card.lastEdited}</span>
            </div>
          </div>
          <div ${isEditable ? `contenteditable="true" onblur="updateSpecialCardBody('${card.id}', this.innerText)"` : ''} class="text-xs text-slate-300 font-mono leading-relaxed whitespace-pre-wrap outline-none focus:ring-1 focus:ring-emerald-500 rounded p-1 transition">${escapeHtml(card.body)}</div>
        </article>
      `;
    }

    function renderEntryCard(entry) {
      const isEditable = currentView === 'editor';
      let petaHtml = '';
      let otherTagsHtml = '';

      for (const [cat, vals] of Object.entries(entry.dynamicTags)) {
        const style = getCategoryStyle(cat);
        const isPeta = cat.toUpperCase().includes('PETA');
        
        vals.forEach(val => {
          const bubbleMarkup = `
            <span class="relative group/tag inline-flex items-center gap-1 px-2.5 py-0.5 ${style.bg} ${style.text} text-[10px] font-mono rounded-full border ${style.border} transition">
              <span onclick="scrollToCard('tags')" class="cursor-pointer hover:underline" title="Jump to Master Tag List">${escapeHtml(val)}</span>
              ${isEditable ? `<button onclick="removeTag(${entry.id}, '${cat}', '${escapeQuotes(val)}')" class="text-rose-400 hover:text-rose-200 font-bold ml-0.5 text-[9px]" title="Remove tag">×</button>` : ''}
            </span>
          `;
          if (isPeta) petaHtml += bubbleMarkup;
          else otherTagsHtml += bubbleMarkup;
        });
      }

      return `
        <article id="entry-${entry.id}" class="bg-slate-900/85 border border-slate-800 rounded-xl p-6 shadow-md space-y-4 hover:border-emerald-500/40 transition">
          <div class="flex flex-wrap gap-1.5 items-center">
            ${petaHtml}
            ${isEditable ? `<button onclick="promptAddTag(${entry.id}, 'PETA TAGS')" class="px-2 py-0.5 bg-slate-800 hover:bg-purple-600 hover:text-slate-950 text-slate-400 text-[10px] font-bold rounded-full border border-slate-700 transition" title="Add PETA Tag">+ Peta</button>` : ''}
          </div>

          <div class="flex flex-col border-b border-slate-800 pb-3 gap-2.5">
            <div class="flex items-center justify-between gap-2">
              <h2 ${isEditable ? `contenteditable="true" onblur="updateEntryTitle(${entry.id}, this.innerText)"` : ''} class="text-lg font-bold text-slate-100 tracking-wide outline-none focus:ring-1 focus:ring-emerald-500 rounded px-1 transition">${escapeHtml(entry.title)}</h2>
              <span class="text-xs font-mono text-slate-400 font-normal flex-shrink-0">${escapeHtml(entry.lastEdited)}</span>
            </div>
            
            <div class="flex flex-wrap gap-1.5 items-center">
              ${otherTagsHtml}
              ${isEditable ? `<button onclick="promptAddTag(${entry.id}, 'META TAGS')" class="px-2 py-0.5 bg-slate-800 hover:bg-emerald-600 hover:text-slate-950 text-slate-400 text-[10px] font-bold rounded-full border border-slate-700 transition" title="Add Tag">+ Tag</button>` : ''}
            </div>
          </div>
          
          <div ${isEditable ? `contenteditable="true" onblur="updateEntryBody(${entry.id}, this.innerText)"` : ''} class="text-xs text-slate-300 font-sans leading-relaxed whitespace-pre-wrap outline-none focus:ring-1 focus:ring-emerald-500 rounded p-1 transition">${isEditable ? escapeHtml(entry.body) : renderProcessedBody(entry.body)}</div>
        </article>
      `;
    }

    function showFullDocument() {
      const container = document.getElementById('readerView');
      let html = '';
      if (masterIndexEntry) html += renderSpecialCard(masterIndexEntry);
      if (masterTagListEntry) html += renderSpecialCard(masterTagListEntry);
      html += parsedEntries.map(e => renderEntryCard(e)).join('');
      container.innerHTML = html;
    }

    function scrollToEntry(id) {
      const el = document.getElementById('entry-' + id);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        el.classList.add('ring-2', 'ring-emerald-500');
        setTimeout(() => el.classList.remove('ring-2', 'ring-emerald-500'), 2000);
      }
    }

    function scrollToEntryTitle(title) {
      const match = parsedEntries.find(e => e.title.toLowerCase() === title.toLowerCase());
      if (match) scrollToEntry(match.id);
    }

    function renderSidebarList(entries) {
      const indexList = document.getElementById('indexList');
      let html = `
        <div onclick="scrollToCard('index')" class="text-emerald-400 py-1 px-2 rounded hover:bg-slate-800/50 truncate cursor-pointer font-bold transition">• THE MASTER LORE INDEX</div>
        <div onclick="scrollToCard('tags')" class="text-amber-400 py-1 px-2 rounded hover:bg-slate-800/50 truncate cursor-pointer font-bold transition">• THE MASTER TAG LIST</div>
      `;
      html += entries.map(e => `
        <div onclick="scrollToEntry(${e.id})" class="text-slate-300 py-1 px-2 rounded hover:bg-slate-800/50 truncate cursor-pointer font-medium transition" title="${escapeHtml(e.title)}">
          • ${escapeHtml(e.title)}
        </div>
      `).join('');
      indexList.innerHTML = html;
    }

    function filterEntries() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = parsedEntries.filter(e => 
        e.title.toLowerCase().includes(query) || 
        e.body.toLowerCase().includes(query) ||
        Object.values(e.dynamicTags).flat().some(v => v.toLowerCase().includes(query))
      );
      const container = document.getElementById('readerView');
      let html = '';
      if (masterIndexEntry) html += renderSpecialCard(masterIndexEntry);
      if (masterTagListEntry) html += renderSpecialCard(masterTagListEntry);
      html += filtered.map(e => renderEntryCard(e)).join('');
      container.innerHTML = html;
    }

    function addNewEntry() {
      const today = new Date().toISOString().split('T')[0];
      const newEntry = {
        id: parsedEntries.length,
        title: "New Lore Entry",
        body: "Write your entry content here...",
        tags: [],
        dynamicTags: { "META TAGS": ["General"] },
        lastEdited: today,
        raw: ""
      };
      parsedEntries.push(newEntry);
      serializeAndSync();
      switchView('editor');
      scrollToEntry(newEntry.id);
    }

    function copyRawText() {
      serializeAndSync();
      const rawTextArea = document.getElementById('rawTextArea');
      rawTextArea.select();
      navigator.clipboard.writeText(rawTextArea.value).then(() => {
        alert('Raw text copied to clipboard!');
      });
    }
  </script>
</body>
</html>
